{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

    <h2 class="mb-3">Agenda de Aulas</h2>

    <!-- ========================= -->
    <!-- FORM AGENDAR -->
    <!-- ========================= -->
    <div class="card p-4 mb-4 shadow-sm">

        <h4>Agendar Aula</h4>

        <form action="/salvar_aula" method="POST">

            <div class="mb-3">
                <label>Aluno</label>
                <select name="aluno_id" class="form-control" required>
                    {% for aluno in alunos %}
                    <option value="{{ aluno['id'] }}">
                        {{ aluno['nome'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Conteúdo</label>
                <select name="conteudo_id" class="form-control" required>
                    {% for conteudo in conteudos %}
                    <option value="{{ conteudo['id'] }}">
                        {{ conteudo['titulo'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Data</label>
                <input type="date" name="data" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Horário</label>
                <input type="time" name="horario" class="form-control" required>
            </div>

            <button class="btn btn-primary">
                Agendar Aula
            </button>

        </form>
    </div>

    <!-- ========================= -->
    <!-- LISTA -->
    <!-- ========================= -->
    <div class="card p-4 shadow-sm">

        <h4>Aulas Agendadas</h4>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Conteúdo</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                {% for aula in aulas %}
                <tr>

                    <td>{{ aula['nome'] }}</td>
                    <td>{{ aula['titulo'] }}</td>
                    <td>{{ aula['data'] }}</td>
                    <td>{{ aula['horario'] }}</td>

                    <td>
                        <a href="/editar_aula/{{ aula['id'] }}"
                           class="btn btn-success btn-sm">
                            Editar
                        </a>

                        <a href="/excluir_aula/{{ aula['id'] }}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Excluir aula?')">
                            Excluir
                        </a>
                    </td>

                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

{% endblock %}

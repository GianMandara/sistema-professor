<!DOCTYPE html>
<html>

<head>

<title>Sistema Pedagógico</title>

<style>

body{
font-family: Arial;
margin:40px;
background:#f4f6f9;
}

.menu{
background:#2c3e50;
padding:15px;
}

.menu a{
color:white;
margin-right:20px;
text-decoration:none;
font-weight:bold;
}

.menu a:hover{
text-decoration:underline;
}

.container{
background:white;
padding:20px;
border-radius:5px;
}

/* NOVO CSS DO DASHBOARD */

.cards{
display:flex;
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0px 2px 6px rgba(0,0,0,0.1);
width:200px;
}

.card h3{
margin-top:0;
}

.card p{
font-size:28px;
font-weight:bold;
}

.card a{
display:inline-block;
margin-top:10px;
text-decoration:none;
background:#3498db;
color:white;
padding:8px 12px;
border-radius:4px;
}

.card a:hover{
background:#2980b9;
}

.card a:hover{
background:#2980b9;
}

/* ESTILO DE FORMULÁRIOS */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#2c3e50;
color:white;
padding:10px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

input{
width:250px;
padding:8px;
border-radius:4px;
border:1px solid #ccc;
}

button{
background:#3498db;
color:white;
border:none;
padding:10px 15px;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

/* ===== TABELA DE ALUNOS ===== */

.tabela-alunos{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.tabela-alunos th{
background:#2c3e50;
color:white;
padding:12px;
text-align:left;
}

.tabela-alunos td{
padding:12px;
border-bottom:1px solid #ddd;
}

.tabela-alunos tr:hover{
background:#f2f2f2;
}

/* ===== COLUNA DE AÇÕES ===== */

.acoes{
display:flex;
gap:10px;
}

/* ===== BOTÕES ===== */

.btn-editar{
background:#27ae60;
color:white;
padding:6px 12px;
border-radius:4px;
text-decoration:none;
}

.btn-editar:hover{
background:#1e8449;
}

.btn-excluir{
background:#e74c3c;
color:white;
padding:6px 12px;
border-radius:4px;
text-decoration:none;
}

.btn-excluir:hover{
background:#c0392b;
}

</style>

</head>

<body>

<div class="menu">

<a href="/">Dashboard</a>
<a href="/alunos">Alunos</a>
<a href="/agenda">Agenda</a>

</div>

<br>

<div class="container">

{% block conteudo %}

{% endblock %}

</div>

</body>

</html>

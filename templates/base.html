<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema Pedagógico</title>

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ICONES -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ===== LAYOUT ===== */
body{
    background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100vh;
    position:fixed;
    background:#1f2d3d;
    color:white;
}

.sidebar h4{
    padding:20px;
}

.sidebar a{
    display:block;
    color:#c2c7d0;
    padding:12px 20px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#343a40;
    color:white;
}

/* CONTEÚDO */
.main{
    margin-left:250px;
    padding:20px;
}

/* NAVBAR */
.topbar{
    background:white;
    padding:15px 20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

/* CARDS */
.card-dashboard{
    border:none;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>📘 Sistema</h4>

    <a href="/"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="/alunos"><i class="fa fa-user"></i> Alunos</a>
    <a href="/agenda"><i class="fa fa-calendar"></i> Agenda</a>
</div>

<!-- CONTEÚDO -->
<div class="main">

    <div class="topbar">
        <strong>Painel Administrativo</strong>
    </div>

    {% block conteudo %}
    {% endblock %}

</div>

</body>
</html>

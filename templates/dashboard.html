{% extends "base.html" %}
{% block conteudo %}

<h3>Dashboard</h3>

<div class="row mb-4">

    <div class="col-md-3">
        <div class="card p-3 text-center shadow-sm">
            <h6>Alunos</h6>
            <h2>{{ alunos }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3 text-center shadow-sm">
            <h6>Aulas</h6>
            <h2>{{ aulas }}</h2>
        </div>
    </div>

</div>

<div class="row">

    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <canvas id="grafico1"></canvas>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <canvas id="grafico2"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const dados = {{ aulas_conteudo | tojson }};

new Chart(document.getElementById("grafico1"), {
    type: "bar",
    data: {
        labels: dados.map(d => d[0]),
        datasets: [{
            label: "Aulas agendadas", // 👈 AQUI ESTÁ A CORREÇÃO
            data: dados.map(d => d[1]),
            backgroundColor: "#4e73df"
        }]
    }
});

new Chart(document.getElementById("grafico2"), {
    type: "doughnut",
    data: {
        labels: ["Alunos", "Aulas"],
        datasets: [{
            data: [{{ alunos }}, {{ aulas }}]
        }]
    }
});
</script>

{% endblock %}

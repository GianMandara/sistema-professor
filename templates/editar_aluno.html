{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

    <h2 class="mb-3">Editar Aluno</h2>

    <div class="card p-4 shadow-sm">

        <!-- ✅ Mantém na mesma rota /editar/<id> -->
        <form method="POST">

            <!-- ⚠️ Segurança (evita erro se aluno não existir) -->
            {% if aluno %}

            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" name="nome" class="form-control"
                       value="{{ aluno['nome'] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ aluno['email'] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" class="form-control"
                       value="{{ aluno['telefone'] }}" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    💾 Atualizar
                </button>

                <a href="/alunos" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

            {% else %}

            <!-- Caso dê erro no ID -->
            <p class="text-danger">Aluno não encontrado.</p>
            <a href="/alunos" class="btn btn-secondary">Voltar</a>

            {% endif %}

        </form>

    </div>

</div>

{% endblock %}

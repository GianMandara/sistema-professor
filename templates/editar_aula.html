{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

    <h2 class="mb-3">Editar Aula</h2>

    <div class="card p-4 shadow-sm">

        <!-- ✅ remove action e usa mesma rota -->
        <form method="POST">

            {% if aula %}

            <!-- ALUNO -->
            <div class="mb-3">
                <label>Aluno</label>
                <select name="aluno_id" class="form-control">

                    {% for aluno in alunos %}
                    <option value="{{ aluno['id'] }}"
                    {% if aluno['id'] == aula['aluno_id'] %} selected {% endif %}>
                        {{ aluno['nome'] }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <!-- CONTEÚDO -->
            <div class="mb-3">
                <label>Conteúdo</label>
                <select name="conteudo_id" class="form-control">

                    {% for conteudo in conteudos %}
                    <option value="{{ conteudo['id'] }}"
                    {% if conteudo['id'] == aula['conteudo_id'] %} selected {% endif %}>
                        {{ conteudo['titulo'] }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <!-- DATA -->
            <div class="mb-3">
                <label>Data</label>
                <input type="date" name="data" class="form-control"
                       value="{{ aula['data'] }}">
            </div>

            <!-- HORÁRIO -->
            <div class="mb-3">
                <label>Horário</label>
                <input type="time" name="horario" class="form-control"
                       value="{{ aula['horario'] }}">
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-success">
                    💾 Salvar Alterações
                </button>

                <a href="/agenda" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

            {% else %}

            <p class="text-danger">Aula não encontrada.</p>
            <a href="/agenda" class="btn btn-secondary">Voltar</a>

            {% endif %}

        </form>

    </div>

</div>

{% endblock %}
